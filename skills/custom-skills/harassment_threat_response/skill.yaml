  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: In the next 14 days, in every harassment or threat episode, evidence collection is declared closed once sufficient for the stated route, no further unblocking or listening for evidence is advised, no undeliverable promise is traded for calm, and no police step is presented as a reliable path to detention or a crime. If no such episode runs in the window, the result is inconclusive rather than a failure.
    window_days: 14
  needs_review: false
  rationale: The assistant declared threat evidence complete yet collection continued until the user could not sleep, then admitted pushing recording caused that night. A promise to help unblock bought only brief calm before threats resumed, and a warning then repeat framing overpromised detention while the outcome was administrative registration only and no detention. No existing skill covers this loop and skill search confirmed the gap, while the AGENTS.md line covers only evidence sufficiency, so a dedicated reusable skill addresses the repeated mechanism.
